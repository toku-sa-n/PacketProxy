plugins {
  id 'com.diffplug.spotless' version '7.1.0'
  id 'org.jetbrains.kotlin.jvm' version '2.2.21' apply false
  id 'org.jetbrains.kotlin.plugin.lombok' version '2.2.21' apply false
  id 'io.freefair.lombok' version '9.0.0' apply false
  id 'me.champeau.jmh' version '0.7.3' apply false
  id 'com.bmuschko.izpack' version '3.2' apply false
  id 'com.github.jk1.dependency-license-report' version '2.5' apply false
  id 'de.undercouch.download' version '5.6.0' apply false
}

repositories {
  mavenCentral()
  maven { url = 'https://jitpack.io' }
}

def spotlessTarget = { String pattern ->
  fileTree('.') {
    include pattern
    exclude 'bin/**', 'build/**', '.gradle/**', 'denaN/**', 'denaL/**', '**/build/**'
  }
}

spotless {
  java {
    target spotlessTarget('**/*.java')
    cleanthat()
    googleJavaFormat()
    eclipse().configFile('eclipse-format-settings.xml')
    formatAnnotations()
  }

  kotlin {
    target spotlessTarget('**/*.kt')
    ktfmt().googleStyle()
    trimTrailingWhitespace()
    endWithNewline()
  }

  groovy {
    target spotlessTarget('**/*.gradle')
    greclipse()
    leadingTabsToSpaces(2)
    trimTrailingWhitespace()
    endWithNewline()
  }

  flexmark {
    target spotlessTarget('**/*.md')
    flexmark()
  }
}

/**
 * 内部ディレクトリ配下に存在する filename の内容を Eval.me で評価し、
 * 各エントリと元ディレクトリを action(dir, entry) の形で渡す汎用イテレータ
 */
ext.eachInternalEntry = { String filename, Closure action ->
  ['dena/', 'denaN/', 'denaL/'].each { def dir ->
    def f = rootProject.file(dir + filename)
    if (f.exists()) {
      Eval.me(f.text).each { action(dir, it) }
    }
  }
}

ext.collectInternalSrcDirs = { String filename ->
  def result = []
  rootProject.ext.eachInternalEntry(filename) { dir, src ->
    if (rootProject.file(dir + src).exists()) {
      result << rootProject.file(dir + src).absolutePath
    }
  }
  return result
}

subprojects {
  if (name == 'app') {
    apply plugin: 'java'
  } else {
    apply plugin: 'java-library'
  }
  apply plugin: 'org.jetbrains.kotlin.jvm'
  apply plugin: 'org.jetbrains.kotlin.plugin.lombok'
  apply plugin: 'io.freefair.lombok'

  lombok {
    version = '1.18.42'
  }

  repositories {
    mavenCentral()
    maven { url = 'https://jitpack.io' }
  }

  java {
    toolchain {
      languageVersion = JavaLanguageVersion.of(17)
    }
  }

  tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
  }

  tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty "file.encoding", "UTF-8"
    workingDir = rootProject.projectDir
  }

  dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'
    testCompileOnly 'org.projectlombok:lombok:1.18.42'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.42'

    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.0'
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.jetbrains.kotlin:kotlin-reflect:2.2.21'
    testImplementation 'org.assertj:assertj-core:3.23.1'
    testImplementation 'org.mockito:mockito-core:4.7.0'

    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'
  }
}

tasks.register('run') {
  dependsOn ':app:run'
  group = 'application'
  description = 'Runs PacketProxy via :app'
}

tasks.register('installDist') {
  dependsOn ':app:installDist'
  group = 'distribution'
  description = 'Installs PacketProxy via :app'
}

[
  'createMacRelease',
  'createWinRelease',
  'createLinuxRelease',
  'release'
].each { taskName ->
  tasks.register(taskName) {
    dependsOn ":app:${taskName}"
    group = 'distribution'
  }
}

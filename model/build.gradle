dependencies {
  api project(':common')

  api 'org.xerial:sqlite-jdbc:3.53.2.0'
  api 'com.j256.ormlite:ormlite-core:4.48'
  api 'com.j256.ormlite:ormlite-jdbc:4.48'
  api 'com.googlecode.java-diff-utils:diffutils:1.2.1'
  api 'dnsjava:dnsjava:3.6.4'
}

apply plugin: 'me.champeau.jmh'

jmh {
  fork = 1
  warmupIterations = 2
  iterations = 5
  warmup = '1s'
  timeOnIteration = '1s'
  benchmarkMode = ['avgt']
  timeUnit = 'ns'
  duplicateClassesStrategy = DuplicatesStrategy.EXCLUDE
}

sourceSets.jmh {
  java.srcDirs = []
  kotlin.srcDirs = ['src/jmh/kotlin']
}
